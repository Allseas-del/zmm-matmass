# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
# Deploy target: DS4 client 400 (repository objects are created here, tested in 410). Run: deploy.cmd or npm run deploy
# Needs a developer user in client 400 (8 Oct 2026: user 10037 exists only in 410 and gets HTTP 403 on deploy there).
specVersion: "4.0"
metadata:
  name: com.allseas.zmmmatmass
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://vhlruds4ci.sap.allseas.global:44300
          client: '400'
        app:
          name: ZMMMATMASS
          description: Material master mass upload
          package: ZMM_MATMASS
          transport: DS4K915674
        exclude:
          - /test/
